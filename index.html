<style>
:root{
  --bg:#132029; --panel:#1B2A34; --panelhi:#223541; --line:#2F4451;
  --ink:#E6EBEF; --dim:#8A9AA7; --faint:#5D7180;
  --blue:#7391D6; --amber:#D9A441; --red:#D4685C; --good:#6FA88A;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font:400 15px/1.4 var(--sans);-webkit-font-smoothing:antialiased}
body{padding:calc(18px + env(safe-area-inset-top)) 14px calc(50px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto}
input,button,select{font-family:inherit}
input:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:3px}
input::placeholder{color:var(--faint)}
.mini{font:400 12px var(--sans);color:var(--dim)}
.hint{font:400 11px var(--sans);color:var(--faint)}
.faint{color:var(--faint)}.good{color:var(--good)}.amber{color:var(--amber)}.red{color:var(--red)}.blue{color:var(--blue)}

.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.headmid{text-align:center}
.sheet{font:600 20px var(--mono)}
.range{font:400 12px var(--sans);color:var(--faint);margin-top:2px}
.nav{background:none;border:none;color:var(--faint);font:400 22px var(--sans);cursor:pointer;padding:4px 8px}
.nav.sm{font-size:13px;padding:2px 4px}

.hero{background:var(--panel);border-radius:10px;padding:16px 14px;margin-bottom:12px}
.herotop{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.heroright{text-align:right}
.big{font:600 36px var(--mono);line-height:1;font-variant-numeric:tabular-nums;margin-top:4px}
.big.amber{color:var(--amber)}.big.red{color:var(--red)}
.ratio{font:500 15px var(--mono);color:var(--dim);font-variant-numeric:tabular-nums;margin-top:4px}
.bar{position:relative;height:8px;background:var(--panelhi);border-radius:4px;margin-top:14px}
.fill{position:absolute;left:0;top:0;bottom:0;background:var(--blue);border-radius:4px}
.fill.amber{background:var(--amber)}.fill.red{background:var(--red)}
.marker{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.75}
.pace{font:400 11px var(--sans);color:var(--faint);margin-top:8px}

.w{border-left:2px solid var(--line);padding:6px 0 6px 10px;margin-bottom:6px;font:400 13px var(--sans);line-height:1.45}
.w.amber{border-color:var(--amber)}.w.red{border-color:var(--red)}

#secs{margin-top:16px}
.sec{margin-bottom:24px}
.sechead{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.dot{width:6px;height:6px;border-radius:3px;flex:0 0 auto;background:var(--dim)}
.dot.good{background:var(--good)}.dot.blue{background:var(--blue)}.dot.amber{background:var(--amber)}
.txt{flex:1;min-width:0;background:transparent;border:none;color:var(--ink);font:400 15px var(--sans);padding:2px 0;outline:none}
.txt.secname{font:600 13px var(--sans);color:var(--dim)}
.num{background:transparent;border:none;border-bottom:1px dashed var(--line);color:var(--ink);
  font:500 15px var(--mono);font-variant-numeric:tabular-nums;text-align:right;padding:2px 0;outline:none}
.num.faint{color:var(--faint)}.num.amber{color:var(--amber)}
.x{background:none;border:none;color:var(--faint);cursor:pointer;font:400 17px var(--sans);padding:0 2px;line-height:1}
.ghost{background:transparent;border:1px solid var(--line);border-radius:6px;color:var(--dim);
  font:500 12px var(--sans);padding:5px 10px;cursor:pointer;white-space:nowrap}
.ghost.good{color:var(--good)}.ghost.blue{color:var(--blue)}.ghost.amber{color:var(--amber)}

.bracketwrap{display:flex;gap:10px;align-items:stretch}
.rows{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px solid var(--panel)}
.months{font:400 11px var(--sans);color:var(--faint);white-space:nowrap}
.months.warnx{color:var(--amber)}
.arrow{color:var(--faint);font:400 12px var(--mono)}
.empty{font:400 13px var(--sans);color:var(--faint);padding:6px 0}
.brace{position:relative;width:10px;flex:0 0 auto}
.brace::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:1px;background:currentColor;opacity:.5}
.brace::after{content:"";position:absolute;left:0;top:50%;width:10px;height:1px;background:currentColor;opacity:.5}
.brace.good{color:var(--good)}.brace.blue{color:var(--blue)}.brace.amber{color:var(--amber)}
.subtot{width:92px;flex:0 0 auto;display:flex;flex-direction:column;justify-content:center;align-items:flex-end}
.sub{font:600 17px var(--mono);font-variant-numeric:tabular-nums}
.sub.good{color:var(--good)}.sub.blue{color:var(--blue)}.sub.amber{color:var(--amber)}
.subnote{font:400 10px var(--sans);color:var(--faint);margin-top:2px;text-align:right}

.form{display:flex;gap:8px;align-items:center;background:var(--panel);border-radius:8px;padding:8px 10px;margin-bottom:10px;flex-wrap:wrap}
.dt{background:transparent;border:none;color:var(--dim);font:400 13px var(--mono);outline:none;color-scheme:dark}
.txt.grow{flex:1;min-width:90px}
.num.amt{width:74px;border-bottom:1px solid var(--line)}
.primary{background:var(--blue);border:none;border-radius:6px;color:var(--bg);font:600 13px var(--sans);padding:7px 13px;cursor:pointer}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0;border-bottom:1px solid var(--line);margin-top:10px}
.daylbl{font:500 12px var(--sans);color:var(--dim)}
.daysum{font:600 13px var(--mono);color:var(--dim);font-variant-numeric:tabular-nums}
.daysum.amber{color:var(--amber)}
.exprow{display:flex;align-items:center;gap:8px;padding:4px 0}
.explbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.expamt{font:400 15px var(--mono);color:var(--dim);font-variant-numeric:tabular-nums}
.spendtot{display:flex;justify-content:flex-end;gap:10px;align-items:baseline;padding-top:8px;margin-top:6px;border-top:1px solid var(--panel)}

.addsec{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:22px}
.foot{border-top:1px solid var(--line);padding-top:12px}
.footrow{display:flex;justify-content:space-between;padding:3px 0}
.footamt{font:400 15px var(--mono);color:var(--dim);font-variant-numeric:tabular-nums}
.footamt.good{color:var(--good)}
.netrow{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.netlbl{font:600 14px var(--sans)}
.net{font:600 22px var(--mono);font-variant-numeric:tabular-nums}
.net.good{color:var(--good)}.net.red{color:var(--red)}

.settings{margin-top:22px;border-top:1px solid var(--panel);padding-top:10px}
.settoggle{background:none;border:none;color:var(--faint);font:400 12px var(--sans);cursor:pointer;padding:0}
.setrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.sel{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font:500 13px var(--mono)}
.statusrow{display:flex;justify-content:space-between;margin-top:8px;gap:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.ghost.on{border-color:var(--blue);color:var(--ink);background:var(--panel)}
.cardtop{display:flex;flex-direction:column;gap:10px;background:var(--panel);border-radius:8px;padding:12px;margin-bottom:10px}
.cardbig{font:600 28px var(--mono);font-variant-numeric:tabular-nums;line-height:1;margin-top:4px}
.cardbig.red{color:var(--red)}
.cardbar{position:relative;height:6px;background:var(--panelhi);border-radius:3px}
.cardfill{position:absolute;left:0;top:0;bottom:0;background:var(--amber);border-radius:3px}
.cardfill.red{background:var(--red)}
.cardrows{margin-bottom:8px}
.cardline{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid var(--panel)}
.cardval{font:500 15px var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.cardval.amber{color:var(--amber)}.cardval.faint{color:var(--faint)}
.num.good{color:var(--good)}
.plans{margin-top:6px}
.planrow{display:flex;align-items:center;gap:8px;padding:4px 0}
.planlbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:400 14px var(--sans)}
.planamt{font:400 14px var(--mono);color:var(--amber);font-variant-numeric:tabular-nums}
.sel.sm{padding:3px 6px;font:500 12px var(--sans)}
.num.tk{width:38px;border-bottom:1px solid var(--line)}
.badge{font:500 10px var(--sans);color:var(--amber);border:1px solid var(--line);border-radius:4px;padding:1px 5px;white-space:nowrap}
.footamt.amber{color:var(--amber)}
.sub.amber{color:var(--amber)}
.grouphead{font:600 11px var(--sans);color:var(--faint);letter-spacing:.06em;text-transform:uppercase;margin:14px 0 4px}
.cardtop .cardline{border-bottom:none;border-top:1px solid var(--panelhi);padding:6px 0 2px}
.cardtop .cardline+.cardline{border-top:none;padding-top:2px}
.cardline.inp{gap:8px}
.lblwrap{display:flex;flex-direction:column;flex:1;min-width:0}
.sublbl{font:400 10px var(--sans);color:var(--faint);margin-top:1px}
.tag{font:500 9px var(--sans);color:var(--faint);border:1px solid var(--line);border-radius:3px;padding:1px 4px;white-space:nowrap;flex:0 0 auto}
.cardline.inp .num{border-bottom:1px dashed var(--blue)}
.cardline.inp .num.good{border-bottom-color:var(--good)}
.sel.sm.rowm{max-width:84px;color:var(--dim)}

.caphead{font:600 11px var(--sans);color:var(--faint);letter-spacing:.06em;text-transform:uppercase;margin:14px 0 4px}
.captbl{border-top:1px solid var(--panel)}
.caprow{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--panel)}
.caprow.tot{border-bottom:none;border-top:1px solid var(--line);margin-top:2px}
.caplbl{flex:1;min-width:0}
.capspent{font:600 16px var(--mono);font-variant-numeric:tabular-nums;color:var(--ink);text-align:right;min-width:72px}
.capspent.amber{color:var(--amber)}
.capsep{color:var(--faint);font:400 13px var(--mono)}
.captot{font:500 15px var(--mono);font-variant-numeric:tabular-nums;color:var(--dim);width:80px;text-align:right}
.caprow.tot .capspent{color:var(--blue)}

.capbox{background:var(--panel);border-radius:8px;padding:10px 12px;margin-bottom:10px}
.caphead{display:flex;justify-content:space-between;align-items:baseline;font:600 11px var(--sans);
  color:var(--faint);letter-spacing:.06em;text-transform:uppercase;margin:0 0 6px}
.caphint{font:400 10px var(--sans);letter-spacing:0;text-transform:none;color:var(--faint)}
.capbox .caprow{border-bottom:1px solid var(--panelhi)}
.capbox .caprow:last-child{border-bottom:none}
.capbox .caprow .num{border-bottom:1px dashed var(--blue)}
.exprow.open{background:var(--panel);border-radius:6px 6px 0 0;padding-left:6px;padding-right:6px}
.exedit{display:flex;align-items:center;gap:8px;background:var(--panel);border-radius:0 0 6px 6px;
  padding:6px 8px 8px;margin-bottom:4px;flex-wrap:wrap}
.editbtn{font:400 15px var(--sans);letter-spacing:1px}
.txt.explbl{flex:1;min-width:0;font:400 15px var(--sans)}
.num.expamt{width:80px;color:var(--dim);border-bottom:1px dashed transparent}
.num.expamt:focus{border-bottom-color:var(--line)}

.num.rate{width:52px;text-align:right;border-bottom:1px dashed var(--blue);color:var(--ink)}
.pct{color:var(--faint);font:400 13px var(--mono);margin-left:-4px}
.cardline.inp .num.amber{border-bottom:1px dashed var(--amber)}

.tick{appearance:none;-webkit-appearance:none;width:17px;height:17px;flex:0 0 auto;margin:0;
  border:1px solid var(--line);border-radius:4px;background:transparent;cursor:pointer;position:relative}
.tick:checked{background:var(--good);border-color:var(--good)}
.tick:checked::after{content:"";position:absolute;left:5px;top:1px;width:4px;height:9px;
  border:solid var(--bg);border-width:0 2px 2px 0;transform:rotate(45deg)}
.row.done .txt{color:var(--faint);text-decoration:line-through}
.row.done .num{color:var(--faint)}
.row.done .sel{opacity:.5}

</style>
</head>

const t=function(k){const v=L[S.lang][k];
  return typeof v==="function"?v.apply(null,Array.prototype.slice.call(arguments,1)):v;};
const AY=i=>L[S.lang].months[i];
const pad=n=>String(n).padStart(2,"0");
const fmt=n=>new Intl.NumberFormat(L[S.lang].locale,{maximumFractionDigits:0}).format(Math.round(n||0));
const parseNum=v=>{const n=parseInt(String(v).replace(/[^\d-]/g,""),10);return isNaN(n)?0:n;};
const uid=()=>Math.random().toString(36).slice(2,9);
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

function cycleStartFor(date,sd){const d=new Date(date.getFullYear(),date.getMonth(),date.getDate());
  return d.getDate()>=sd?new Date(d.getFullYear(),d.getMonth(),sd):new Date(d.getFullYear(),d.getMonth()-1,sd);}
const cycleId=s=>`${s.getFullYear()}-${pad(s.getMonth()+1)}`;
const startFromId=(id,sd)=>{const[y,m]=id.split("-").map(Number);return new Date(y,m-1,sd);};
const shiftCycle=(id,delta,sd)=>{const s=startFromId(id,sd);return cycleId(new Date(s.getFullYear(),s.getMonth()+delta,sd));};
const nextStart=(s,sd)=>new Date(s.getFullYear(),s.getMonth()+1,sd);
const cycleEnd=(s,sd)=>new Date(nextStart(s,sd).getTime()-DAY);
const cycleLen=(s,sd)=>Math.round((nextStart(s,sd)-s)/DAY);

const LS={
  get(k){try{return localStorage.getItem(k);}catch(e){return null;}},
  set(k,v){try{localStorage.setItem(k,v);return true;}catch(e){return false;}},
  keys(){try{return Object.keys(localStorage).filter(k=>k.indexOf("pd:")===0);}catch(e){return [];}}
};

function h(tag,props){
  const e=document.createElement(tag);
  const p=props||{};
  for(const k in p){
    const v=p[k];
    if(v==null) continue;
    if(k==="style") Object.assign(e.style,v);
    else if(k==="class") e.className=v;
    else if(k==="text") e.textContent=v;
    else if(k.slice(0,2)==="on") e.addEventListener(k.slice(2).toLowerCase(),v);
    else e.setAttribute(k,v);
  }
  for(let i=2;i<arguments.length;i++){
    const kids=Array.isArray(arguments[i])?arguments[i]:[arguments[i]];
    kids.forEach(c=>{if(c==null||c===false)return;e.appendChild(typeof c==="object"?c:document.createTextNode(String(c)));});
  }
  return e;
}

/* ---------- model ---------- */
const KINDS={
  in:{key:"kind_in",cls:"good",sign:1},
  out:{key:"kind_out",cls:"blue",sign:-1},
  carry:{key:"kind_carry",cls:"amber",sign:-1},
  spend:{key:"kind_spend",cls:"blue",sign:-1},
  card:{key:"kind_card",cls:"amber",sign:-1}
};
const isCash=e=>!e.m||e.m==="cash";
const perInst=p=>p.n?(p.total||0)/p.n:0;
const instDue=c=>(c.plans||[]).reduce((a,p)=>a+((p.paid||0)<p.n?perInst(p):0),0);
const instFuture=c=>(c.plans||[]).reduce((a,p)=>a+Math.max(0,p.n-(p.paid||0)-1)*perInst(p),0);
function fixedOnCard(data,cardId){           // karta bagli sabit gider satirlari
  let v=0;
  data.sections.forEach(sec=>{ if(sec.kind==="out")sec.rows.forEach(r=>{
    if(r.m===cardId)v+=r.amount||0;});});
  return v;
}
function cardCharge(data,cardId){            // gelecek aya gecen: tek cekimler + karttaki sabitler
  let v=fixedOnCard(data,cardId);
  data.sections.forEach(sec=>{ if(sec.kind==="spend")sec.expenses.forEach(e=>{
    if(e.m===cardId&&(!e.tk||e.tk<2))v+=e.amount||0;});});
  return v;
}
function cardBlocked(data,cardId){           // bu dongude karta binen her sey, tam tutar
  let v=fixedOnCard(data,cardId);
  const c=data.sections.filter(x=>x.id===cardId)[0];
  if(c)v+=c.fee||0;
  data.sections.forEach(sec=>{ if(sec.kind==="spend")sec.expenses.forEach(e=>{
    if(e.m===cardId)v+=((e.tk||1)>1?instTotal(e):(e.amount||0));});});
  return v;
}
const instTotal=e=>(e.tkTotal&&e.tkTotal>0)?e.tkTotal:(e.amount||0);
const cardUnpaid=c=>Math.max(0,(c.debt||0)-(c.pay||0));
const cardInterest=c=>(c.intAmt||0)>0?c.intAmt:cardUnpaid(c)*((c.rate||0)/100);
const cardAvail=(data,c)=>(c.avail||0)-cardBlocked(data,c.id)+(c.pay||0);
const cardNext=(data,c)=>cardCharge(data,c.id)+instDue(c)+(c.fee||0)+cardInterest(c);
const secTotal=s=>{
  if(s.kind==="carry")return s.rows.reduce((a,r)=>a+(r.alloc||0),0);
  if(s.kind==="spend")return s.expenses.filter(isCash).reduce((a,e)=>a+(e.amount||0),0);
  if(s.kind==="card")return s.pay||0;
  if(s.kind==="out")return s.rows.filter(isCash).reduce((a,r)=>a+(r.amount||0),0);
  return s.rows.reduce((a,r)=>a+(r.amount||0),0);
};
const capTotal=s=>(s.cap||0)+(s.capCard||0);
const rowAmt=(s,r)=>s.kind==="carry"?(r.alloc||0):(r.amount||0);
const pendingTotal=s=>(s.rows||[]).reduce((a,r)=>a+(r.done?0:rowAmt(s,r)),0);
function subNote(s){
  const parts=[];
  if(s.kind==="out"||s.kind==="in"||s.kind==="carry"){
    const total=(s.rows||[]).reduce((a,r)=>a+rowAmt(s,r),0);
    const pend=pendingTotal(s);
    if(total>0)parts.push(pend>0?t("pending_"+s.kind,fmt(pend)):t("allDone"));
  }
  if(s.kind==="out"){const oc=secOnCard(s); if(oc>0)parts.push(t("onCardNote",fmt(oc)));}
  if(s.kind==="carry"){
    const leftB=s.rows.reduce((a,r)=>a+Math.max(0,(r.balance||0)-(r.alloc||0)),0);
    parts.push(leftB>0?t("carried",fmt(leftB)):t("clean"));
  }
  return parts.join(" · ");
}
function syncPlan(e){                       // harcamanin taksit planini yeniden kur
  S.data.sections.forEach(c=>{ if(c.kind==="card"&&c.plans)
    c.plans=c.plans.filter(p=>p.eid!==e.id); });
  if(!isCash(e)&&(e.tk||1)>1){
    const card=S.data.sections.filter(x=>x.id===e.m)[0];
    if(card){card.plans=card.plans||[];
      card.plans.push({id:uid(),eid:e.id,label:e.label,total:instTotal(e),n:e.tk,paid:0});}
  }
}
function dropExpense(sec,e){
  S.data.sections.forEach(c=>{ if(c.kind==="card"&&c.plans)
    c.plans=c.plans.filter(p=>p.eid!==e.id); });
  sec.expenses=sec.expenses.filter(x=>x.id!==e.id);
}
const secOnCard=s=>{
  if(s.kind==="spend")return s.expenses.filter(e=>!isCash(e)).reduce((a,e)=>a+(e.amount||0),0);
  if(s.kind==="out")return s.rows.filter(r=>!isCash(r)).reduce((a,r)=>a+(r.amount||0),0);
  return 0;
};
const newSection=k=>k==="spend"
  ?{id:uid(),kind:k,name:t(KINDS[k].key),cap:0,capCard:0,defm:"cash",expenses:[],rows:[]}
  :k==="card"
  ?{id:uid(),kind:k,name:t(KINDS[k].key),limit:0,avail:0,debt:0,pay:0,fee:0,rate:0,intAmt:0,plans:[],rows:[]}
  :{id:uid(),kind:k,name:t(KINDS[k].key),rows:[]};

const SEED=()=>({sections:[
  {id:uid(),kind:"in",name:t("sec_in"),rows:[
    {id:uid(),label:"",amount:0},{id:uid(),label:"",amount:0}]},
  {id:uid(),kind:"out",name:t("sec_out"),rows:[
    {id:uid(),label:"",amount:0},{id:uid(),label:"",amount:0},{id:uid(),label:"",amount:0}]},
  {id:uid(),kind:"carry",name:t("sec_carry"),rows:[
    {id:uid(),label:"",balance:0,alloc:0,months:1}]},
  {id:uid(),kind:"spend",name:t("sec_spend"),cap:0,expenses:[],rows:[]}
]});

const rollover=prev=>({sections:prev.sections.map(s=>{
  if(s.kind==="spend")return Object.assign({},s,{id:uid(),expenses:[]});
  if(s.kind==="card")return Object.assign({},s,{
    id:s.id,
    debt:cardUnpaid(s)+cardNext(prev,s),
    avail:cardAvail(prev,s)-cardInterest(s),
    pay:0, fee:0, intAmt:0,
    plans:(s.plans||[]).map(p=>Object.assign({},p,{paid:(p.paid||0)+1})).filter(p=>p.paid<p.n)});
  if(s.kind==="carry")return Object.assign({},s,{id:uid(),rows:s.rows.map(r=>({
    id:uid(),label:r.label,balance:Math.max(0,(r.balance||0)-(r.alloc||0)),
    alloc:0,done:false,months:(r.alloc||0)>0?1:(r.months||1)+1})).filter(r=>r.balance>0)});
  return Object.assign({},s,{id:uid(),rows:s.rows.map(r=>Object.assign({},r,{id:uid(),done:false}))});
})});

/* ---------- state ---------- */
const S={editing:null,startDay:7,lang:"tr",id:null,data:null,draft:{date:iso(new Date()),label:"",amount:"",m:"cash",tk:1},settingsOpen:false,status:""};

function loadSettings(){
  const raw=LS.get("pd:settings");
  if(raw){try{const s=JSON.parse(raw);if(s&&s.startDay)S.startDay=s.startDay;if(s&&s.lang&&L[s.lang])S.lang=s.lang;}catch(e){}}
}
function loadCycle(id){
  const raw=LS.get("pd:cycle:"+id);
  if(raw){try{return JSON.parse(raw);}catch(e){}}
  // atlanan aylar olabilir: en son kullanilan donguyu geriye dogru ara (12 aya kadar)
  let cur=id;
  for(let k=0;k<12;k++){
    cur=shiftCycle(cur,-1,S.startDay);
    const prev=LS.get("pd:cycle:"+cur);
    if(prev){try{return rollover(JSON.parse(prev));}catch(e){}}
  }
  return SEED();
}
let saveTimer=null;
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(flushSave,400);
}
function flushSave(){
  clearTimeout(saveTimer);
  if(!S.data||!S.id)return;
  S.status=LS.set("pd:cycle:"+S.id,JSON.stringify(S.data))?t("saved"):t("notSaved");
  const el=document.getElementById("status");
  if(el)el.textContent=S.status;
  setTimeout(()=>{const e2=document.getElementById("status");if(e2&&e2.textContent===t("saved"))e2.textContent="";},1500);
}
window.addEventListener("beforeunload",flushSave);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")flushSave();});

function goCycle(id){flushSave();S.editing=null;S.id=id;S.data=loadCycle(id);render();}
function setLang(l){
  if(!L[l]||l===S.lang)return;
  flushSave();
  S.lang=l;
  LS.set("pd:settings",JSON.stringify({startDay:S.startDay,lang:S.lang}));
  document.documentElement.lang=l;
  document.title=t("title");
  render();
}
function setStartDay(sd){
  flushSave();
  S.startDay=Math.min(28,Math.max(1,sd||1));
  LS.set("pd:settings",JSON.stringify({startDay:S.startDay,lang:S.lang}));
  S.id=cycleId(cycleStartFor(new Date(),S.startDay));
  S.data=loadCycle(S.id);
  render();
}

/* ---------- derived ---------- */
function ctx(){
  const today=new Date();
  const liveId=cycleId(cycleStartFor(today,S.startDay));
  const start=startFromId(S.id,S.startDay);
  const end=cycleEnd(start,S.startDay);
  const days=cycleLen(start,S.startDay);
  const isLive=S.id===liveId;
  const elapsed=isLive?Math.min(days,Math.floor((today-start)/DAY)+1):days;
  return {today,liveId,start,end,days,isLive,elapsed,left:Math.max(0,days-elapsed)};
}

/* ---------- inputs ---------- */
function numInput(get,set,width,cls){
  const i=h("input",{class:"num "+(cls||""),inputmode:"numeric",style:{width:(width||92)+"px"}});
  i.value=fmt(get());
  i.addEventListener("focus",()=>{const v=get();i.value=v?String(v):"";setTimeout(()=>i.select(),0);});
  i.addEventListener("input",()=>{set(parseNum(i.value));refresh();scheduleSave();});
  i.addEventListener("blur",()=>{i.value=fmt(get());});
  return i;
}
function textInput(get,set,ph,cls){
  const i=h("input",{class:"txt "+(cls||""),placeholder:ph||""});
  i.value=get()||"";
  i.addEventListener("input",()=>{set(i.value);refresh();scheduleSave();});
  return i;
}
const fmtRate=n=>(Math.round((n||0)*100)/100).toLocaleString(L[S.lang].locale,{maximumFractionDigits:2});
function rateInput(get,set){
  const i=h("input",{class:"num rate",inputmode:"decimal"});
  i.value=fmtRate(get());
  i.addEventListener("focus",()=>{const v=get();i.value=v?String(v).replace(".",","):"";setTimeout(()=>i.select(),0);});
  i.addEventListener("input",()=>{
    const n=parseFloat(String(i.value).replace(/[^\d.,-]/g,"").replace(",","."));
    set(isNaN(n)?0:Math.max(0,n));refresh();scheduleSave();});
  i.addEventListener("blur",()=>{i.value=fmtRate(get());});
  return i;
}
const xBtn=fn=>h("button",{class:"x","aria-label":t("del"),onclick:fn,text:"×"});

/* ---------- render ---------- */
function render(){
  const app=document.getElementById("app");
  app.textContent="";
  const wrap=h("div",{class:"wrap"});
  wrap.appendChild(headEl());
  wrap.appendChild(h("div",{id:"hero"}));
  wrap.appendChild(h("div",{id:"warn"}));
  wrap.appendChild(secsEl());
  wrap.appendChild(addSecEl());
  wrap.appendChild(h("div",{id:"foot",class:"foot"}));
  wrap.appendChild(settingsEl());
  app.appendChild(wrap);
  refresh();
}

function headEl(){
  const c=ctx();
  const sheet=`${c.start.getMonth()+1}/${String(c.start.getFullYear()).slice(2)}`;
  const range=`${c.start.getDate()} ${AY(c.start.getMonth())} – ${c.end.getDate()} ${AY(c.end.getMonth())}`;
  return h("div",{class:"head"},
    h("button",{class:"nav","aria-label":t("prevCycle"),onclick:()=>goCycle(shiftCycle(S.id,-1,S.startDay)),text:"‹"}),
    h("div",{class:"headmid"},
      h("div",{class:"sheet",text:sheet}),
      h("div",{class:"range",text:range+" · "+c.days+" "+t("days")+(c.isLive?"":" · "+t("closed"))})),
    h("button",{class:"nav","aria-label":t("nextCycle"),onclick:()=>goCycle(shiftCycle(S.id,1,S.startDay)),text:"›"}));
}

function secsEl(){
  const box=h("div",{id:"secs"});
  S.data.sections.forEach((s,idx)=>box.appendChild(sectionEl(s,idx)));
  return box;
}

function moveUp(idx){
  if(idx<=0)return;
  const a=S.data.sections.slice();
  const t=a[idx-1];a[idx-1]=a[idx];a[idx]=t;
  S.data.sections=a;scheduleSave();render();
}

function sectionEl(s,idx){
  const k=KINDS[s.kind];
  const head=h("div",{class:"sechead"},
    h("span",{class:"dot "+k.cls}),
    textInput(()=>s.name,v=>{s.name=v;},t("secName"),"secname"));
  if(s.kind==="spend"){
    const dSel=h("select",{class:"sel sm",title:t("defmLbl")});
    dSel.appendChild(h("option",{value:"cash",text:t("methodCash")}));
    S.data.sections.filter(x=>x.kind==="card").forEach(c=>
      dSel.appendChild(h("option",{value:c.id,"data-cid":c.id,text:c.name||t("sec_card")})));
    dSel.value=s.defm||"cash";
    dSel.addEventListener("change",()=>{s.defm=dSel.value;S.draft.mSet=false;flushSave();render();});
    head.appendChild(dSel);
  }else if(s.kind==="card"){
    head.appendChild(h("span",{class:"mini",text:t("limitLbl")}));
    head.appendChild(numInput(()=>s.limit||0,v=>{s.limit=v;},80));
  }else{
    head.appendChild(h("button",{class:"ghost",text:t("addRow"),onclick:()=>{
      s.rows.push(s.kind==="carry"?{id:uid(),label:"",balance:0,alloc:0,months:1}:{id:uid(),label:"",amount:0});
      scheduleSave();render();}}));
  }
  head.appendChild(h("button",{class:"nav sm","aria-label":t("moveUp"),onclick:()=>moveUp(idx),text:"↑"}));
  head.appendChild(xBtn(()=>{
    if(s.kind==="card")S.data.sections.forEach(sec=>{
      if(sec.kind==="spend"){
        if(sec.defm===s.id)sec.defm="cash";
        sec.expenses.forEach(e=>{ if(e.m===s.id){e.m="cash";e.tk=1;}});}
      if(sec.kind==="out")sec.rows.forEach(r=>{ if(r.m===s.id)r.m="cash";});});
    if(s.kind==="card")S.draft.mSet=false;
    S.data.sections=S.data.sections.filter(x=>x.id!==s.id);scheduleSave();render();}));

  const body=s.kind==="spend"?spendBody(s):s.kind==="card"?cardBody(s):bracketBody(s);
  return h("div",{class:"sec"},head,body);
}

function bracketBody(s){
  const k=KINDS[s.kind];
  const rows=h("div",{class:"rows"});
  if(!s.rows.length)rows.appendChild(h("div",{class:"empty",text:t("emptyRows")}));
  const tick=r=>{
    const b=h("input",{type:"checkbox",class:"tick","aria-label":t("doneMark")});
    b.checked=!!r.done;
    b.addEventListener("change",()=>{r.done=b.checked;flushSave();render();});
    return b;
  };
  s.rows.forEach(r=>{
    if(s.kind==="carry"){
      rows.appendChild(h("div",{class:"row"+(r.done?" done":"")},
        tick(r),
        textInput(()=>r.label,v=>{r.label=v;},t("item")),
        h("span",{class:"months "+(r.alloc?"":"warnx"),id:"m-"+r.id,text:t("cycleN",r.months)}),
        numInput(()=>r.balance||0,v=>{r.balance=v;},64,"faint"),
        h("span",{class:"arrow",text:"→"}),
        numInput(()=>r.alloc||0,v=>{r.alloc=v;},64,"amber"),
        xBtn(()=>{s.rows=s.rows.filter(y=>y.id!==r.id);scheduleSave();render();})));
    }else{
      const row=h("div",{class:"row"+(r.done?" done":"")},
        tick(r),
        textInput(()=>r.label,v=>{r.label=v;},t("item")));
      if(s.kind==="out"){
        const cards=S.data.sections.filter(x=>x.kind==="card");
        if(cards.length){
          const ms=h("select",{class:"sel sm rowm",title:t("defmLbl")});
          ms.appendChild(h("option",{value:"cash",text:t("methodCash")}));
          cards.forEach(c=>ms.appendChild(h("option",{value:c.id,"data-cid":c.id,text:c.name||t("sec_card")})));
          if(!isCash(r)&&!cards.some(c=>c.id===r.m))r.m="cash";
          ms.value=r.m||"cash";
          ms.addEventListener("change",()=>{r.m=ms.value;flushSave();render();});
          row.appendChild(ms);
        }
      }
      row.appendChild(numInput(()=>r.amount||0,v=>{r.amount=v;},92,isCash(r)?"":"amber"));
      row.appendChild(xBtn(()=>{s.rows=s.rows.filter(y=>y.id!==r.id);scheduleSave();render();}));
      rows.appendChild(row);
    }
  });
  if(s.kind==="carry")rows.appendChild(h("div",{class:"hint",text:t("carryHint")}));
  return h("div",{class:"bracketwrap"},
    rows,
    h("div",{class:"brace "+k.cls}),
    h("div",{class:"subtot"},
      h("div",{class:"sub "+k.cls,id:"sub-"+s.id,text:fmt(secTotal(s))}),
      h("div",{class:"subnote",id:"note-"+s.id,text:subNote(s)})));
}

function spendBody(s){
  const c=ctx();
  const dailyCap=c.days?capTotal(s)/c.days:0;
  const dateI=h("input",{type:"date",class:"dt"});dateI.value=S.draft.date;
  dateI.addEventListener("input",()=>{S.draft.date=dateI.value;});
  const lblI=h("input",{class:"txt grow",placeholder:t("whatFor"),id:"draftlabel"});lblI.value=S.draft.label;
  lblI.addEventListener("input",()=>{S.draft.label=lblI.value;});
  const amtI=h("input",{class:"num amt",inputmode:"numeric",placeholder:"0"});amtI.value=S.draft.amount;
  amtI.addEventListener("input",()=>{S.draft.amount=amtI.value;});
  const cards=S.data.sections.filter(x=>x.kind==="card");
  const mSel=h("select",{class:"sel sm"});
  mSel.appendChild(h("option",{value:"cash",text:t("methodCash")}));
  cards.forEach(c=>mSel.appendChild(h("option",{value:c.id,"data-cid":c.id,text:c.name||t("sec_card")})));
  if(!S.draft.mSet)S.draft.m=s.defm||"cash";
  if(S.draft.m!=="cash"&&!cards.some(c=>c.id===S.draft.m))S.draft.m="cash";
  mSel.value=S.draft.m;
  const tkI=h("input",{class:"num tk",inputmode:"numeric",title:t("tkLbl")});
  tkI.value=S.draft.tk||1;
  tkI.style.display=S.draft.m==="cash"?"none":"";
  tkI.addEventListener("input",()=>{S.draft.tk=Math.max(1,parseInt(tkI.value,10)||1);});
  mSel.addEventListener("change",()=>{S.draft.m=mSel.value;S.draft.mSet=true;
    tkI.style.display=S.draft.m==="cash"?"none":"";});
  const add=()=>{
    const n=parseNum(S.draft.amount);
    if(n<=0)return;
    const lbl=(S.draft.label||"").trim()||"—";
    const tk=S.draft.m==="cash"?1:Math.max(1,parseInt(S.draft.tk,10)||1);
    const ex={id:uid(),date:S.draft.date,label:lbl,amount:n,m:S.draft.m,tk:tk};
    s.expenses.push(ex);
    syncPlan(ex);
    S.draft.label="";S.draft.amount="";S.draft.tk=1;S.draft.mSet=false;
    flushSave();render();
    const f=document.getElementById("draftlabel");if(f)f.focus();
  };
  [lblI,amtI].forEach(i=>i.addEventListener("keydown",e=>{if(e.key==="Enter")add();}));
  const form=h("div",{class:"form"},dateI,lblI,amtI,mSel,tkI,h("button",{class:"primary",text:t("add"),onclick:add}));

  const list=h("div",{});
  const m={};
  s.expenses.forEach(e=>{(m[e.date]=m[e.date]||[]).push(e);});
  const days=Object.keys(m).sort().reverse();
  if(!days.length)list.appendChild(h("div",{class:"empty",text:t("noEntries")}));
  days.forEach(d=>{
    const dt=new Date(d+"T00:00:00");
    const sum=m[d].reduce((a,e)=>a+e.amount,0);
    const cardName=id=>{const c=S.data.sections.filter(x=>x.id===id)[0];return c?(c.name||t("sec_card")):null;};
    list.appendChild(h("div",{class:"dayhead"},
      h("span",{class:"daylbl",text:dt.getDate()+" "+AY(dt.getMonth())}),
      h("span",{class:"daysum"+(dailyCap&&sum>dailyCap?" amber":""),text:fmt(sum)})));
    m[d].forEach(e=>{
      const open=S.editing===e.id;
      list.appendChild(h("div",{class:"exprow"+(open?" open":"")},
        textInput(()=>e.label,v=>{e.label=v;syncPlan(e);},t("whatFor"),"explbl"),
        isCash(e)?null:h("span",{class:"badge","data-cid":e.m,"data-tk":e.tk||1,
          text:(cardName(e.m)||t("sec_card"))+(e.tk>1?" ×"+e.tk:"")}),
        numInput(()=>e.amount||0,v=>{e.amount=v;syncPlan(e);},80,"expamt"),
        h("button",{class:"x editbtn","aria-label":t("editLbl"),text:open?"×":"⋯",
          onclick:()=>{S.editing=open?null:e.id;flushSave();render();}}),
        xBtn(()=>{dropExpense(s,e);flushSave();render();})));
      if(open){
        const di=h("input",{type:"date",class:"dt"});di.value=e.date;
        di.addEventListener("input",()=>{if(di.value){e.date=di.value;flushSave();render();}});
        const panel=h("div",{class:"exedit"},
          h("span",{class:"mini",text:t("dateLbl")}),di);
        if(cards.length){
          const es=h("select",{class:"sel sm"});
          es.appendChild(h("option",{value:"cash",text:t("methodCash")}));
          cards.forEach(c=>es.appendChild(h("option",{value:c.id,"data-cid":c.id,text:c.name||t("sec_card")})));
          es.value=isCash(e)?"cash":e.m;
          const ti=h("input",{class:"num tk",inputmode:"numeric",title:t("tkLbl")});
          ti.value=e.tk||1;
          ti.style.display=isCash(e)?"none":"";
          ti.addEventListener("input",()=>{e.tk=Math.max(1,parseInt(ti.value,10)||1);syncPlan(e);flushSave();render();});
          es.addEventListener("change",()=>{e.m=es.value;if(es.value==="cash"){e.tk=1;e.tkTotal=0;}syncPlan(e);flushSave();render();});
          panel.appendChild(es); panel.appendChild(ti);
          if(!isCash(e)&&(e.tk||1)>1){
            panel.appendChild(h("span",{class:"mini",text:t("tkTotalLbl")}));
            panel.appendChild(numInput(()=>instTotal(e),v=>{e.tkTotal=v;syncPlan(e);},84,"amber"));
            const vf=instTotal(e)-(e.amount||0);
            panel.appendChild(h("span",{class:"hint",id:"vf-"+e.id,text:vf>0?t("vadeFarki",fmt(vf)):""}));
          }
        }
        list.appendChild(panel);
      }
    });
  });
  const hasCard=S.data.sections.some(x=>x.kind==="card")||(s.capCard||0)>0;
  const capRow=(lbl,spentVal,spentId,getCap,setCap)=>h("div",{class:"caprow"},
    h("span",{class:"mini caplbl",text:lbl}),
    h("span",{class:"capspent",id:spentId,text:fmt(spentVal)}),
    h("span",{class:"capsep",text:"/"}),
    h("span",{class:"tag",text:t("youType")}),
    numInput(getCap,setCap,80));
  const cash=secTotal(s), oncard=secOnCard(s);
  const capBox=h("div",{class:"capbox"},
    h("div",{class:"caphead"},
      h("span",{text:t("capHead")}),
      h("span",{class:"caphint",text:t("spentLbl")+" / "+t("cap")})),
    capRow(t("capCash"),cash,"sub-"+s.id,()=>s.cap||0,v=>{s.cap=v;}),
    hasCard?capRow(t("capCardL"),oncard,"oncard-"+s.id,()=>s.capCard||0,v=>{s.capCard=v;}):null,
    hasCard?h("div",{class:"caprow tot"},
      h("span",{class:"mini caplbl",text:t("capTotal")}),
      h("span",{class:"capspent",id:"ct-"+s.id,text:fmt(cash+oncard)}),
      h("span",{class:"capsep",text:"/"}),
      h("span",{class:"captot",id:"cg-"+s.id,text:fmt(capTotal(s))})):null);
  return h("div",{},capBox,form,list);
}

function cardBody(s){
  const charge=cardCharge(S.data,s.id);
  const blocked=cardBlocked(S.data,s.id);
  const rem=cardAvail(S.data,s);
  const rows=h("div",{class:"cardrows"});
  const line=(lbl,val,cls,id)=>h("div",{class:"cardline"},
    h("span",{class:"mini",text:lbl}),
    h("span",{class:"cardval "+(cls||""),id:id,text:fmt(val)}));
  rows.appendChild(h("div",{class:"cardline inp"},
    h("span",{class:"lblwrap"},
      h("span",{class:"mini",text:t("cardDue")}),
      h("span",{class:"sublbl",text:t("cardDueHint")})),
    h("span",{class:"tag",text:t("youType")}),
    numInput(()=>s.debt||0,v=>{s.debt=v;},92)));
  rows.appendChild(h("div",{class:"cardline inp"},
    h("span",{class:"lblwrap"},
      h("span",{class:"mini",text:t("cardPaid")}),
      h("span",{class:"sublbl",text:t("cardPaidHint")})),
    h("span",{class:"tag",text:t("youType")}),
    numInput(()=>s.pay||0,v=>{s.pay=v;},92,"good")));
  rows.appendChild(h("div",{class:"cardline inp"},
    h("span",{class:"lblwrap"},
      h("span",{class:"mini",text:t("feeLbl")}),
      h("span",{class:"sublbl",text:t("feeHint")})),
    h("span",{class:"tag",text:t("youType")}),
    numInput(()=>s.fee||0,v=>{s.fee=v;},92,"amber")));
  rows.appendChild(h("div",{class:"cardline inp"},
    h("span",{class:"lblwrap"},
      h("span",{class:"mini",text:t("rateLbl")}),
      h("span",{class:"sublbl",id:"rh-"+s.id,
        text:(s.intAmt||0)>0?t("rateManual"):t("rateHint")})),
    rateInput(()=>s.rate||0,v=>{s.rate=v;s.intAmt=0;}),
    h("span",{class:"pct",text:"%"}),
    (function(){const ia=numInput(()=>cardInterest(s),v=>{s.intAmt=v;},92,"amber");ia.id="ia-"+s.id;return ia;})()));
  rows.appendChild(line(t("onCard"),cardNext(S.data,s),"amber","onc-"+s.id));
  rows.appendChild(line(t("futureInst"),instFuture(s),"faint","fut-"+s.id));

  const plans=h("div",{class:"plans"});
  if(!(s.plans||[]).length)plans.appendChild(h("div",{class:"hint",text:t("noPlans")}));
  (s.plans||[]).forEach(p=>plans.appendChild(h("div",{class:"planrow"},
    h("span",{class:"planlbl",id:"pll-"+(p.eid||p.id),text:p.label||"—"}),
    h("span",{class:"hint",id:"pln-"+(p.eid||p.id),text:t("instLeft",p.n-(p.paid||0))}),
    h("span",{class:"planamt",id:"pla-"+(p.eid||p.id),text:fmt(perInst(p))}),
    xBtn(()=>{s.plans=s.plans.filter(x=>x.id!==p.id);flushSave();render();}))));

  return h("div",{},
    h("div",{class:"cardtop"},
      h("div",{},
        h("div",{class:"mini",text:t("remLimit")}),
        h("div",{class:"cardbig "+(rem<0?"red":""),id:"rem-"+s.id,text:fmt(rem)})),
      h("div",{class:"cardbar"},h("div",{class:"cardfill "+(rem<0?"red":""),id:"fill-"+s.id,
        style:{width:(s.limit?Math.min(100,Math.max(0,((s.limit-rem)/s.limit)*100)):0)+"%"}})),
      h("div",{class:"cardline inp"},
        h("span",{class:"mini",text:t("availLbl")}),
        h("span",{class:"tag",text:t("youType")}),
        numInput(()=>s.avail||0,v=>{s.avail=v;},92)),
      h("div",{class:"cardline"},
        h("span",{class:"mini",text:t("blockedLbl")}),
        h("span",{class:"cardval amber",id:"blk-"+s.id,text:fmt(blocked)}))),
    h("div",{class:"grouphead",text:t("payHead")}),
    rows,
    h("div",{class:"grouphead",text:t("plansHead")}),
    plans);
}

function addSecEl(){
  const box=h("div",{class:"addsec"});
  Object.keys(KINDS).forEach(k=>box.appendChild(
    h("button",{class:"ghost "+KINDS[k].cls,text:"+ "+t(KINDS[k].key),
      onclick:()=>{S.data.sections.push(newSection(k));scheduleSave();render();}})));
  return box;
}

function settingsEl(){
  const body=h("div",{id:"setbody",style:{display:S.settingsOpen?"block":"none"}});
  const sel=h("select",{class:"sel"});
  for(let n=1;n<=28;n++){const o=h("option",{value:n,text:String(n)});if(n===S.startDay)o.selected=true;sel.appendChild(o);}
  sel.addEventListener("change",()=>setStartDay(Number(sel.value)));
  body.appendChild(h("div",{class:"setrow"},h("span",{class:"mini",text:t("startDayLbl")}),sel));
  const langRow=h("div",{class:"setrow"},h("span",{class:"mini",text:t("langLbl")}));
  ["tr","en"].forEach(l=>langRow.appendChild(h("button",{
    class:"ghost"+(S.lang===l?" on":""),text:l.toUpperCase(),onclick:()=>setLang(l)})));
  body.appendChild(langRow);

  const fileI=h("input",{type:"file",accept:".json",style:{display:"none"}});
  fileI.addEventListener("change",()=>{
    const f=fileI.files&&fileI.files[0];if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>{
      try{
        const obj=JSON.parse(rd.result);
        Object.keys(obj).forEach(k=>{if(k.indexOf("pd:")===0)LS.set(k,obj[k]);});
        loadSettings();S.id=cycleId(cycleStartFor(new Date(),S.startDay));S.data=loadCycle(S.id);render();
      }catch(e){alert(t("badFile"));}
    };
    rd.readAsText(f);
  });
  body.appendChild(h("div",{class:"setrow"},
    h("button",{class:"ghost",text:t("backupGet"),onclick:()=>{
      flushSave();
      const obj={};LS.keys().forEach(k=>obj[k]=LS.get(k));
      const blob=new Blob([JSON.stringify(obj,null,1)],{type:"application/json"});
      const a=h("a",{href:URL.createObjectURL(blob),download:"para-dongusu-yedek.json"});
      document.body.appendChild(a);a.click();a.remove();
    }}),
    h("button",{class:"ghost",text:t("backupPut"),onclick:()=>fileI.click()}),
    fileI));
  body.appendChild(h("div",{class:"hint",text:t("backupHint")}));

  const toggle=h("button",{class:"settoggle",text:t("settings")+" +",onclick:function(){
    S.settingsOpen=!S.settingsOpen;
    body.style.display=S.settingsOpen?"block":"none";
    this.textContent=t("settings")+" "+(S.settingsOpen?"−":"+");
  }});
  return h("div",{class:"settings"},toggle,body,
    h("div",{class:"statusrow"},
      h("span",{class:"hint",text:t("storeHint")}),
      h("span",{class:"hint",id:"status",text:""})));
}

/* ---------- refresh (hesaplanan alanlar) ---------- */
function refresh(){
  const c=ctx();
  const spend=S.data.sections.filter(s=>s.kind==="spend")[0];
  const spentCash=spend?secTotal(spend):0;
  const spentCard=spend?secOnCard(spend):0;
  const spent=spentCash+spentCard;
  const cap=spend?capTotal(spend):0;
  const capLeft=cap-spent;
  const pace=cap?(cap/c.days)*c.elapsed:0;
  const perDay=c.left>0?capLeft/c.left:capLeft;
  const projected=c.elapsed>0?(spent/c.elapsed)*c.days:0;
  const over=cap>0&&spent>pace;
  const net=S.data.sections.reduce((a,s)=>a+KINDS[s.kind].sign*secTotal(s),0);

  let onCardTotal=0;
  S.data.sections.forEach(s=>{
    const oc=secOnCard(s);
    onCardTotal+=oc;
    if(s.kind==="spend"){
      const ocEl=document.getElementById("oncard-"+s.id);
      if(ocEl)ocEl.textContent=fmt(oc);
      const ct=document.getElementById("ct-"+s.id);
      if(ct)ct.textContent=fmt(secTotal(s)+oc);
      const cg=document.getElementById("cg-"+s.id);
      if(cg)cg.textContent=fmt(capTotal(s));
      const cs=document.getElementById("sub-"+s.id);
      if(cs)cs.className="capspent"+(secTotal(s)>(s.cap||0)&&(s.cap||0)>0?" amber":"");
      if(ocEl)ocEl.className="capspent"+(oc>(s.capCard||0)&&(s.capCard||0)>0?" amber":"");
    }
    if(s.kind==="card"){
      const rem=cardAvail(S.data,s);
      const r=document.getElementById("rem-"+s.id);
      if(r){r.textContent=fmt(rem);r.className="cardbig "+(rem<0?"red":"");}
      const f=document.getElementById("fill-"+s.id);
      if(f){f.style.width=(s.limit?Math.min(100,Math.max(0,((s.limit-rem)/s.limit)*100)):0)+"%";
            f.className="cardfill "+(rem<0?"red":"");}
      const b=document.getElementById("blk-"+s.id);
      if(b)b.textContent=fmt(cardBlocked(S.data,s.id));
      const o=document.getElementById("onc-"+s.id);
      if(o)o.textContent=fmt(cardNext(S.data,s));
      const rh=document.getElementById("rh-"+s.id);
      if(rh)rh.textContent=(s.intAmt||0)>0?t("rateManual"):t("rateHint");
      const ia=document.getElementById("ia-"+s.id);
      if(ia&&document.activeElement!==ia)ia.value=fmt(cardInterest(s));
      const fu=document.getElementById("fut-"+s.id);
      if(fu)fu.textContent=fmt(instFuture(s));
      (s.plans||[]).forEach(p=>{
        const k=p.eid||p.id;
        const pa=document.getElementById("pla-"+k); if(pa)pa.textContent=fmt(perInst(p));
        const pl=document.getElementById("pll-"+k); if(pl)pl.textContent=p.label||"—";
        const pn=document.getElementById("pln-"+k); if(pn)pn.textContent=t("instLeft",p.n-(p.paid||0));
      });
    }
    const el=document.getElementById("sub-"+s.id);
    if(el)el.textContent=fmt(secTotal(s));
    const nt=document.getElementById("note-"+s.id);
    if(nt&&s.kind!=="spend"&&s.kind!=="card")nt.textContent=subNote(s);
    if(s.kind==="carry")s.rows.forEach(r=>{
      const m=document.getElementById("m-"+r.id);
      if(m)m.className="months "+(r.alloc?"":"warnx");
    });
  });

  document.querySelectorAll("option[data-cid]").forEach(o=>{
    const c=S.data.sections.filter(x=>x.id===o.getAttribute("data-cid"))[0];
    if(c){const n=c.name||t("sec_card");if(o.textContent!==n)o.textContent=n;}
  });
  document.querySelectorAll(".badge[data-cid]").forEach(b=>{
    const c=S.data.sections.filter(x=>x.id===b.getAttribute("data-cid"))[0];
    if(c)b.textContent=(c.name||t("sec_card"))+(b.getAttribute("data-tk")>1?" ×"+b.getAttribute("data-tk"):"");
  });

  S.data.sections.forEach(sec=>{ if(sec.kind==="spend")sec.expenses.forEach(e=>{
    const v=document.getElementById("vf-"+e.id);
    if(v){const vf=instTotal(e)-(e.amount||0);v.textContent=vf>0?t("vadeFarki",fmt(vf)):"";}
  });});

  const hero=document.getElementById("hero");
  hero.textContent="";
  if(spend){
    const tone=capLeft<0?"red":"";
    hero.appendChild(h("div",{class:"hero"},
      h("div",{class:"herotop"},
        h("div",{},
          h("div",{class:"mini",text:c.isLive?t("perDay",c.left):t("cycleClosed")}),
          h("div",{class:"big "+tone,text:fmt(perDay)})),
        h("div",{class:"heroright"},
          h("div",{class:"mini",text:c.isLive?t("dayOf",c.elapsed,c.days):c.days+" "+t("days")}),
          h("div",{class:"ratio"},fmt(spent),h("span",{class:"faint",text:" / "+fmt(cap)})))),
      (function(){
        const bar=h("div",{class:"bar"});
        bar.appendChild(h("div",{class:"fill "+tone,style:{width:(cap?Math.min(100,(spent/cap)*100):0)+"%"}}));
        if(c.isLive)bar.appendChild(h("div",{class:"marker",style:{left:Math.min(100,(c.elapsed/c.days)*100)+"%"}}));
        return bar;
      })(),
      spend&&(spend.capCard||0)>0?h("div",{class:"pace"},
        t("splitLine",fmt(spentCash)+" / "+fmt(spend.cap||0),fmt(spentCard)+" / "+fmt(spend.capCard||0))):null));
  }

  const warn=document.getElementById("warn");
  warn.textContent="";
  S.data.sections.filter(s=>s.kind==="carry").forEach(s=>s.rows.forEach(r=>{
    if(!r.alloc&&r.balance>0)warn.appendChild(h("div",{class:"w amber",
      text:t("wCarry",r.label||t("wItem"),r.months,fmt(r.balance))}));
  }));
  if(net<0)warn.appendChild(h("div",{class:"w red",text:t("wShort",fmt(-net))}));
  S.data.sections.filter(x=>x.kind==="card").forEach(c=>{
    const rem=cardAvail(S.data,c);
    if(rem<0)warn.appendChild(h("div",{class:"w red",
      text:(c.name||t("sec_card"))+": "+t("overLimit")+" ("+fmt(-rem)+")"}));
  });


  const foot=document.getElementById("foot");
  foot.textContent="";
  S.data.sections.forEach(s=>{
    const v=KINDS[s.kind].sign*secTotal(s);
    foot.appendChild(h("div",{class:"footrow"},
      h("span",{class:"mini",text:s.name||t(KINDS[s.kind].key)}),
      h("span",{class:"footamt"+(v<0?"":" good"),text:v<0?"−"+fmt(-v):fmt(v)})));
  });
  if(onCardTotal>0)foot.appendChild(h("div",{class:"footrow"},
    h("span",{class:"mini",text:t("onCardShort")}),
    h("span",{class:"footamt amber",text:fmt(onCardTotal)})));
  foot.appendChild(h("div",{class:"netrow"},
    h("span",{class:"netlbl",text:onCardTotal>0?t("netCash"):t("net")}),
    h("span",{class:"net "+(net<0?"red":"good"),text:net<0?"−"+fmt(-net):fmt(net)})));
}

/* ---------- boot ---------- */
function boot(){
  loadSettings();
  document.documentElement.lang=S.lang;
  document.title=t("title");
  S.id=cycleId(cycleStartFor(new Date(),S.startDay));
  S.data=loadCycle(S.id);
  render();
  flushSave();
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);else boot();

if("serviceWorker" in navigator && location.protocol.slice(0,4)==="http"){
  window.addEventListener("load",function(){navigator.serviceWorker.register("./sw.js").catch(function(){});});
}
